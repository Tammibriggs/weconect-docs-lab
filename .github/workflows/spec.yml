# Checks the spec on every pull request and every push to main, with the same
# commands you run locally. No path filter: a required check that a path filter
# skips stays "pending" forever, and the jobs are short.
name: Spec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint the spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to commit SHAs, because a version tag can be moved to other code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # --ignore-scripts skips the MongoDB download, which linting doesn't need
      - run: npm ci --ignore-scripts

      - name: Lint the full spec, rebuild the public spec, and lint that too
        run: npm run lint:spec
        env:
          # Shows each problem on its line in the pull request
          REDOCLY_CLI_LINT_FORMAT: github-actions

      # lint:spec has just rebuilt the public spec, so a difference means the
      # committed copy is out of date, or was edited by hand
      - name: Check that the committed public spec is up to date
        run: |
          git diff --exit-code -- openapi/weconect-public.yaml || {
            echo "::error file=openapi/weconect-public.yaml::Out of date. Run npm run build:spec and commit the result."
            exit 1
          }

  contract:
    name: Contract tests
    # Pinned because MongoDB 6.0 has no build for newer Ubuntu releases: the tests
    # download the build for Ubuntu 22.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # --ignore-scripts because test:capture downloads MongoDB itself when it starts
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: api

      # Keeps that download between runs, so an outage at mongodb.org can't fail a check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ hashFiles('scripts/api-server.mjs') }}

      # Calls the API in this pull request and saves each response
      - name: Run every test case against the API
        run: npm run test:capture -- --out tests/runs/ci

      # The two contract checks: does the API match the spec, in both directions?
      - name: Check that every response matches the spec
        run: npm run test:validate -- tests/runs/ci
      - name: Check that every documented response and field was returned
        run: npm run test:coverage -- tests/runs/ci
