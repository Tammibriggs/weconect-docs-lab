# Netlify settings for the docs site. In Netlify, set the base directory to
# docs; Netlify then reads this file and runs the build from this folder.
[build]
  command = "npm run build"
  publish = "build"
  # By default Netlify skips the build if nothing changed in the base directory,
  # but the site is generated from the public spec, which is outside it. Exit
  # code 0 skips the build. The refs are the same on a build without a cache,
  # which must build.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" . ../openapi/weconect-public.yaml'

[build.environment]
  NODE_VERSION = "24"

# The site has no home page yet: open the API overview. force applies the rule
# even though the build has an index.html at /.
[[redirects]]
  from = "/"
  to = "/reference/weconect-api"
  status = 302
  force = true
